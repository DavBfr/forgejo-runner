name: Renovate
description: Runs Renovate with configurable log level

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:
    inputs:
      log_level:
        description: "Log level for Renovate"
        required: false
        default: info
        type: choice
        options:
          - debug
          - info
          - warn
          - error

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/renovatebot/renovate:44
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/renovate.json
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Renovate
        run: renovate
        env:
          RENOVATE_CONFIG_FILE: .github/renovate.json
          RENOVATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RENOVATE_GITHUB_COM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RENOVATE_PLATFORM: github
          RENOVATE_ENDPOINT: ${{ github.server_url }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_REQUIRE_CONFIG: ignored
          LOG_LEVEL: ${{ github.event.inputs.log_level || 'warn' }}
